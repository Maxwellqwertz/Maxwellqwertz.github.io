<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr. Maximilian Wörner</title>

<style>
body { font-family: Arial, sans-serif; margin:0; }

nav {
  position: fixed;
  top: 0;
  width: 100%;
  background: #336633; /* dunkelgrün */
  border-bottom: 1px solid #2a4d2a;
  padding: 10px;
  display: flex;
  gap: 20px;
  z-index: 1000;
}
nav a { text-decoration: none; color: white; font-weight: bold; }

.container {
  margin-top: 70px;
  padding: 20px;
  max-width: 1000px;
}

h1, h2 { border-bottom: 1px solid #2a4d2a; padding-bottom: 5px; color:#336633; }

.card { 
  border-radius: 10px; 
  padding: 15px; 
  margin-bottom: 20px; 
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

#videos {
  background-color: #a3d9a5; /* grüner Hintergrund für Videos */
  display: flex;
  gap: 20px;
  padding: 15px;
  justify-content: space-between;
  border-radius: 10px;
}

#videos .youtube-card {
  background-color: black;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  padding: 5px;
}

#videos .tiktok-card {
  background-color: white;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  padding: 5px;
}

#videos iframe {
  border: 0;
  border-radius: 6px;
}

/* YouTube unverändert */
#videos iframe.youtube {
  width: 100%;
  height: 400px;
}

/* TikTok kleiner, passt in weißen Kasten */
#videos iframe.tiktok {
  width: 100%;
  height: 400px; /* halb so hoch wie vorher, kein Scrollen */
}
</style>
</head>

<body>

<nav>
  <a href="#about">Über mich</a>
  <a href="#videos">Videos</a>
  <a href="#story">Wie alles begann</a>
</nav>

<div class="container">

<h1>Dr. Maximilian Wörner</h1>

<div id="videos" class="card">
  <div class="youtube-card">
    <iframe class="youtube" src="https://www.youtube.com/embed/TzSq2p1QYb0" allowfullscreen></iframe>
  </div>
  <div class="tiktok-card">
    <iframe class="tiktok" src="https://www.tiktok.com/embed/7566655555285060886" allowfullscreen></iframe>
  </div>
</div>

</div>
</body>
</html>

</body>
</html>
